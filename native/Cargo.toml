[package]
name = "media-converter-native"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "media_converter_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.27", features = ["abi3-py312"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
