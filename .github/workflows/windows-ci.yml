name: Windows CI

on:
  pull_request:
  push:

jobs:
  test-and-portable-build:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_CONTROLS_STYLE: Basic
      MEDIA_CONVERTER_REQUIRE_FFMPEG_TESTS: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint with Ruff
        run: python -m ruff check app services ui utils tests cli.py main.py

      - name: Install FFmpeg
        run: choco install ffmpeg --no-progress --yes

      - name: Expose FFmpeg for integration tests
        shell: pwsh
        run: |
          $testFfmpeg = Get-ChildItem "$env:ChocolateyInstall\lib\ffmpeg" -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          if (-not $testFfmpeg) { throw 'FFmpeg not found.' }
          "MEDIA_CONVERTER_TEST_FFMPEG=$($testFfmpeg.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run tests
        run: python -m pytest -q --tb=short

      - name: Build portable package
        shell: pwsh
        run: |
          $ffmpeg = Get-ChildItem "$env:ChocolateyInstall\lib\ffmpeg" -Filter ffmpeg.exe -Recurse |
            Where-Object { Test-Path (Join-Path $_.Directory.FullName 'ffprobe.exe') } |
            Select-Object -First 1
          if (-not $ffmpeg) { throw 'FFmpeg binaries were not installed.' }
          $ffmpegDir = $ffmpeg.Directory.FullName
          python scripts\build_pyinstaller.py --portable --ffmpeg-dir $ffmpegDir
          $required = @(
            'dist\MediaConverter\MediaConverter.exe',
            'dist\MediaConverter\ffmpeg\ffmpeg.exe',
            'dist\MediaConverter\ffmpeg\ffprobe.exe',
            'dist\MediaConverter\portable.ini'
          )
          $required | ForEach-Object { if (-not (Test-Path $_)) { throw "Missing portable build file: $_" } }

      - name: Verify portable application behavior
        run: python scripts/verify_package.py dist/MediaConverter/MediaConverter.exe --report package-smoke.json

      - name: Collect benchmark report
        shell: pwsh
        run: python scripts/performance_suite.py --ffmpeg "$env:MEDIA_CONVERTER_TEST_FFMPEG" --report performance.json --repeats 3

      - name: Check performance against PR base on the same runner
        if: github.event_name == 'pull_request'
        env:
          PERFORMANCE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: pwsh
        run: python scripts/check_performance_regression.py --base-sha "$env:PERFORMANCE_BASE_SHA" --ffmpeg "$env:MEDIA_CONVERTER_TEST_FFMPEG" --head-report performance.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MediaConverter-windows-portable
          path: |
            dist/MediaConverter
            package-smoke.json
            performance.json
            regression.json
          if-no-files-found: error
